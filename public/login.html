<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso - Sistema PCP Kuryos</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --success: #16a34a;
      --danger: #dc2626;
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 40px 32px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }
    
    .logo-area {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .logo-area span {
      font-size: 40px;
      display: block;
      margin-bottom: 8px;
    }
    
    .logo-area h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    
    .logo-area p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    
    .tabs {
      display: flex;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
    }
    
    .tab {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    
    .tab.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }
    
    .form-group {
      margin-bottom: 20px;
    }
    
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    
    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-color);
      font-size: 15px;
      transition: all 0.15s;
    }
    
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }
    
    .btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
    }
    
    .btn:hover {
      background: var(--primary-dark);
    }
    
    .feedback-message {
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 20px;
      display: none;
      line-height: 1.4;
    }
    
    .feedback-message.error {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #fca5a5;
      display: block;
    }
    
    .feedback-message.success {
      background: rgba(22, 163, 74, 0.15);
      border: 1px solid rgba(22, 163, 74, 0.3);
      color: #86efac;
      display: block;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="logo-area">
    <span>🏭</span>
    <h1>Kuryos PCP</h1>
    <p>Sistema de Controle de Produção</p>
  </div>
  
  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="switchTab('login')">Entrar</button>
    <button class="tab" id="tab-register" onclick="switchTab('register')">Cadastrar</button>
  </div>
  
  <div id="feedback" class="feedback-message"></div>
  
  <!-- Form Login -->
  <form id="form-login" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="login-email">E-mail</label>
      <input type="email" id="login-email" required placeholder="exemplo@kuryos.com">
    </div>
    <div class="form-group">
      <label for="login-password">Senha</label>
      <input type="password" id="login-password" required placeholder="Sua senha">
    </div>
    <button type="submit" class="btn">Entrar no Sistema</button>
  </form>
  
  <!-- Form Cadastro -->
  <form id="form-register" onsubmit="handleRegister(event)" style="display:none;">
    <div class="form-group">
      <label for="reg-name">Nome Completo</label>
      <input type="text" id="reg-name" required placeholder="Seu nome">
    </div>
    <div class="form-group">
      <label for="reg-email">E-mail</label>
      <input type="email" id="reg-email" required placeholder="exemplo@kuryos.com">
    </div>
    <div class="form-group">
      <label for="reg-password">Senha</label>
      <input type="password" id="reg-password" required minlength="6" placeholder="Mínimo 6 caracteres">
    </div>
    <button type="submit" class="btn">Criar Conta</button>
  </form>
</div>

<script>
  // Firebase Configuration
  var firebaseConfig = {
    apiKey: "AIzaSyAKfI4MTbydlskdg5lMuvESfLIBhlPwQdw",
    authDomain: "prod-kuryos.firebaseapp.com",
    databaseURL: "https://prod-kuryos-default-rtdb.firebaseio.com",
    projectId: "prod-kuryos",
    storageBucket: "prod-kuryos.firebasestorage.app",
    messagingSenderId: "323674581733",
    appId: "1:323674581733:web:e283a491c0c2bd6025420c"
  };
  firebase.initializeApp(firebaseConfig);
  
  const auth = firebase.auth();
  const db = firebase.database();
  
  // Check URL query parameters for pending status
  window.onload = function() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('status') === 'pending') {
      showFeedback('warning', 'Acesso pendente: Sua conta foi criada, mas ainda não foi ativada por um administrador. Entre em contato para liberação.');
    }
    
    // Check if user is already logged in but pending
    auth.onAuthStateChanged(user => {
      if (user) {
        db.ref('usuarios/' + user.uid).once('value', snap => {
          const profile = snap.val();
          if (profile && profile.role !== 'pending') {
            // Already approved, redirect
            redirectUser(profile.role);
          }
        });
      }
    });
  };
  
  function switchTab(mode) {
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const feedback = document.getElementById('feedback');
    
    feedback.className = 'feedback-message';
    feedback.style.display = 'none';
    
    if (mode === 'login') {
      tabLogin.classList.add('active');
      tabRegister.classList.remove('active');
      formLogin.style.display = 'block';
      formRegister.style.display = 'none';
    } else {
      tabLogin.classList.remove('active');
      tabRegister.classList.add('active');
      formLogin.style.display = 'none';
      formRegister.style.display = 'block';
    }
  }
  
  function showFeedback(type, text) {
    const feedback = document.getElementById('feedback');
    feedback.textContent = text;
    feedback.className = 'feedback-message ' + (type === 'error' ? 'error' : 'success');
    feedback.style.display = 'block';
  }
  
  function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const pass = document.getElementById('login-password').value;
    const feedback = document.getElementById('feedback');
    
    feedback.style.display = 'none';
    
    auth.signInWithEmailAndPassword(email, pass)
      .then(cred => {
        db.ref('usuarios/' + cred.user.uid).once('value')
          .then(snap => {
            const profile = snap.val();
            if (!profile || profile.role === 'pending') {
              showFeedback('error', 'Acesso pendente: Sua conta ainda não foi aprovada pelo Administrador.');
              auth.signOut();
            } else {
              redirectUser(profile.role);
            }
          });
      })
      .catch(err => {
        let msg = 'Erro ao realizar login. Verifique seu e-mail e senha.';
        if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
          msg = 'E-mail ou senha incorretos.';
        } else if (err.code === 'auth/invalid-email') {
          msg = 'Formato de e-mail inválido.';
        } else {
          msg = 'Erro ao realizar login: ' + err.message + ' (' + err.code + ')';
        }
        showFeedback('error', msg);
      });
  }
  
  function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const pass = document.getElementById('reg-password').value;
    const feedback = document.getElementById('feedback');
    
    feedback.style.display = 'none';
    
    auth.createUserWithEmailAndPassword(email, pass)
      .then(cred => {
        // Create user node in DB
        db.ref('usuarios/' + cred.user.uid).set({
          nome: name,
          email: email,
          role: 'pending',
          created_at: new Date().toISOString()
        })
        .then(() => {
          auth.signOut(); // logout newly created user
          showFeedback('success', 'Cadastro realizado com sucesso! Sua conta (' + email + ') agora aguarda ativação pelo administrador do PCP.');
          document.getElementById('form-register').reset();
          switchTab('login');
        });
      })
      .catch(err => {
        let msg = 'Erro ao criar conta. Tente novamente.';
        if (err.code === 'auth/email-already-in-use') {
          msg = 'Este e-mail já está em uso por outro usuário.';
        } else if (err.code === 'auth/weak-password') {
          msg = 'A senha fornecida é muito fraca. Deve conter pelo menos 6 caracteres.';
        } else {
          msg = 'Erro ao criar conta: ' + err.message + ' (' + err.code + ')';
        }
        showFeedback('error', msg);
      });
  }
  
  function redirectUser(role) {
    if (role === 'admin') {
      window.location.href = 'dashboard.html';
    } else if (role === 'production') {
      window.location.href = 'form.html';
    } else {
      showFeedback('error', 'Perfil desconhecido no sistema.');
    }
  }
</script>
</body>
</html>
