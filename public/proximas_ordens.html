<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Próximas Ordens</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://prod-kuryos-default-rtdb.firebaseio.com">
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="shared/utils.js"></script>
  <script src="shared/perdas-etapa.js"></script>
  <script src="shared/manipulacao.js"></script>
  <script src="shared/sequencia-setor.js"></script>
  <script src="shared/sequencia-setor-tela.js"></script>
  <script src="auth_check.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    :root{--primary:#0a1c69;--success:#0ca30c;--danger:#d03b3b;--warning:#c9910a;--bg:#f5f5f7;--card:#fff;--border:#d2d2d7;--text:#1d1d1f;--muted:#6e6e73;--surface-2:#f9fafb;--tint-green-bg:#d1fae5;--tint-green-fg:#065f46;--tint-red-bg:#fee2e2;--tint-red-fg:#991b1b;--tint-gray-bg:#f3f4f6;--tint-blue-bg:#eff6ff;--tint-orange-bg:#fff7ed;--tint-orange-fg:#c2410c;--tint-purple-bg:#f3e8ff;--purple:#7c3aed}
    @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--primary:#5e83ea;--bg:#000;--card:#1c1c1e;--border:#38383a;--text:#f5f5f7;--muted:#98989d;--surface-2:#242426;--tint-green-bg:rgba(16,185,129,.18);--tint-green-fg:#6ee7b7;--tint-red-bg:rgba(239,68,68,.18);--tint-red-fg:#fca5a5;--tint-gray-bg:rgba(255,255,255,.08);--tint-blue-bg:rgba(94,131,234,.18);--tint-orange-bg:rgba(251,146,60,.18);--tint-orange-fg:#fdba74;--tint-purple-bg:rgba(167,139,250,.18);--purple:#a78bfa}}
    :root[data-theme="dark"]{color-scheme:dark;--primary:#5e83ea;--bg:#000;--card:#1c1c1e;--border:#38383a;--text:#f5f5f7;--muted:#98989d;--surface-2:#242426;--tint-green-bg:rgba(16,185,129,.18);--tint-green-fg:#6ee7b7;--tint-red-bg:rgba(239,68,68,.18);--tint-red-fg:#fca5a5;--tint-gray-bg:rgba(255,255,255,.08);--tint-blue-bg:rgba(94,131,234,.18);--tint-orange-bg:rgba(251,146,60,.18);--tint-orange-fg:#fdba74;--tint-purple-bg:rgba(167,139,250,.18);--purple:#a78bfa}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-ui);background:var(--bg);color:var(--text);min-height:100vh}
    .header{padding:26px 0 6px;display:flex;align-items:flex-start;justify-content:space-between;max-width:96%;margin:0 auto;gap:12px}
    .header h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
    .header-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
    .status-pill{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--text) 6%,transparent);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
    .dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}.dot.on{background:var(--success)}
    .main{padding:0 0 40px;max-width:96%;margin:0 auto}
    .alert{padding:12px 16px;border-radius:8px;font-size:13px;font-weight:500;margin-bottom:12px;display:none}
    #alertBox{position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:1000;width:min(560px,calc(100% - 24px));box-shadow:0 8px 24px rgba(0,0,0,.18);margin:0;pointer-events:none}
    .alert.show{display:block}
    .alert-success{background:var(--tint-green-bg);color:var(--tint-green-fg)}
    .alert-danger{background:var(--tint-red-bg);color:var(--tint-red-fg)}
    .setores{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
    .setor{padding:10px 16px;border-radius:22px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-weight:700;font-size:14px;cursor:pointer;min-height:44px}
    .setor.on{background:var(--primary);border-color:var(--primary);color:#fff}
    .nota{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:12px}
    .nota a{color:var(--primary);font-weight:700}
    @media(max-width:980px){ .header{padding-left:62px} }
    @media(max-width:700px){
      .header h1{font-size:22px}
      .main,.header{max-width:100%;padding-left:12px;padding-right:12px}
      .header{padding-left:62px}
    }
  </style>
</head>
<body class="kuryos-theme has-sidebar">
<div class="header">
  <div>
    <h1 id="titulo">Próximas Ordens</h1>
    <div class="header-sub" id="subtitulo">A fila do setor, na ordem definida pelo PCP — só consulta</div>
  </div>
  <div class="status-pill"><span class="dot" id="sDot"></span><span id="sTxt">Conectando...</span></div>
</div>

<div class="main">
  <div class="alert" id="alertBox"></div>
  <div class="setores" id="setores"></div>
  <div class="nota" id="nota">A primeira da lista é a próxima a fazer. O horário de término é estimado pelo ritmo e pelo turno, e se refaz a cada apontamento.</div>
  <div id="fila"><div class="nota">Carregando…</div></div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyAKfI4MTbydlskdg5lMuvESfLIBhlPwQdw",
  authDomain: "prod-kuryos.firebaseapp.com",
  databaseURL: kuryosDatabaseURL("https://prod-kuryos-default-rtdb.firebaseio.com"),
  projectId: "prod-kuryos",
  storageBucket: "prod-kuryos.firebasestorage.app",
  messagingSenderId: "323674581733",
  appId: "1:323674581733:web:e283a491c0c2bd6025420c"
};
firebase.initializeApp(firebaseConfig);
kuryosConnectEmulatorsIfLocal();
var db = firebase.database();

/* Próximas Ordens (29/09): cada setor consulta a própria fila -- "cada
   setor poderá consultar ao que lhe compreende". A ordem é do setor
   inteiro, montada pelo PCP no Planejamento (aba Sequência por setor). */
var setorAtual = null, tela = null;

function setStatus(on, txt) {
  document.getElementById('sDot').classList.toggle('on', !!on);
  document.getElementById('sTxt').textContent = txt;
}
function showAlert(msg, tipo) {
  var box = document.getElementById('alertBox');
  box.textContent = msg;
  box.className = 'alert alert-' + (tipo || 'success') + ' show';
  setTimeout(function() { box.classList.remove('show'); }, 6000);
}

// Setores que a pessoa enxerga: os da Operação dela, a Separação para a
// Logística; a gestão (PCP/admin) vê os quatro.
function setoresPermitidos() {
  var u = window.currentUser;
  if (!u || typeof window.setoresOperacao !== 'function') return [];
  var s = window.setoresOperacao(u);
  var logistica = typeof window.usuarioTemModulo === 'function' && window.usuarioTemModulo(u, 'logistica');
  var tem = {separacao: logistica, manipulacao: s.manipulacao, envase: s.producao, rotulagem: s.rotulagem};
  return SequenciaSetor.ORDEM_SETORES.filter(function(k) { return s.gestao || tem[k]; });
}
function escolherSetorInicial() {
  var pedido = new URLSearchParams(location.search).get('setor');
  var permitidos = setoresPermitidos();
  if (!permitidos.length) return null;
  return permitidos.indexOf(pedido) >= 0 ? pedido : permitidos[0];
}

function renderSetores() {
  var permitidos = setoresPermitidos();
  var box = document.getElementById('setores');
  box.style.display = permitidos.length > 1 ? '' : 'none';
  box.innerHTML = permitidos.map(function(k) {
    return '<button type="button" class="setor' + (k === setorAtual ? ' on' : '') + '" data-setor="' + k + '">' + escapeHtml(SequenciaSetor.SETORES[k].rotulo) + '</button>';
  }).join('');
  box.querySelectorAll('[data-setor]').forEach(function(b) {
    b.onclick = function() {
      setorAtual = b.getAttribute('data-setor');
      history.replaceState(null, '', 'proximas_ordens.html?setor=' + setorAtual);
      iniciar();
    };
  });
}

function iniciar() {
  if (!setorAtual) setorAtual = escolherSetorInicial();
  var fila = document.getElementById('fila');
  if (!setorAtual) {
    fila.innerHTML = '<div class="nota">Seu usuário não tem nenhum setor com fila de ordens.</div>';
    return;
  }
  var rotulo = SequenciaSetor.SETORES[setorAtual].rotulo;
  document.getElementById('titulo').textContent = 'Próximas Ordens — ' + rotulo;
  document.title = 'Próximas Ordens — ' + rotulo;
  var s = window.setoresOperacao(window.currentUser);
  document.getElementById('nota').innerHTML = 'A primeira da lista é a próxima a fazer. O horário de término é estimado pelo ritmo e pelo turno, e se refaz a cada apontamento.' +
    (s.gestao ? ' A ordem se muda no <a href="planejamento.html?tab=sequencia">Planejamento › Sequência por setor</a>.' : '');
  renderSetores();
  if (tela) tela.parar();
  tela = SequenciaSetorTela.montar(fila, {db: db, setores: [setorAtual], podeEditar: false});
}

db.ref('.info/connected').on('value', function(s) { setStatus(s.val(), s.val() ? 'Conectado' : 'Reconectando...'); });
// O perfil (window.currentUser) chega depois do carregamento.
var esperaPerfil = setInterval(function() { if (window.currentUser) { clearInterval(esperaPerfil); iniciar(); } }, 300);
</script>
</body>
</html>
