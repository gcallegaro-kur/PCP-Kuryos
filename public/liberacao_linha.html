<style>
:root{--ok:#0a7d3c;--ok-bg:#e3f6ea;--warn:#a15c00;--warn-bg:#fff1d6;--bad:#c42b2b;--bad-bg:#fde8e8;--info:#1f4fb8;--info-bg:#e6edfc;--mute-bg:#f0f0f3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ok:#6fe3a0;--ok-bg:rgba(60,200,120,.16);--warn:#ffcb6b;--warn-bg:rgba(250,178,25,.16);--bad:#ff8f8f;--bad-bg:rgba(240,80,80,.18);--info:#9db7ff;--info-bg:rgba(94,131,234,.2);--mute-bg:rgba(255,255,255,.08)}}
:root[data-theme="dark"]{--ok:#6fe3a0;--ok-bg:rgba(60,200,120,.16);--warn:#ffcb6b;--warn-bg:rgba(250,178,25,.16);--bad:#ff8f8f;--bad-bg:rgba(240,80,80,.18);--info:#9db7ff;--info-bg:rgba(94,131,234,.2);--mute-bg:rgba(255,255,255,.08)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui)}
.pg{max-width:1100px;margin:0 auto;padding:24px 18px 80px}
h1{margin:0;font-size:27px;letter-spacing:-.02em}h2{margin:0;font-size:18px}
.sub{font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.45;max-width:780px}
.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;margin-bottom:14px}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.barra select{max-width:260px}
.card{background:var(--panel);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px}
.card.op.lib{border-left:4px solid var(--ok)}
.linha-cab{font-size:13.5px}
.op-cab{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.etapas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.etapa{border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;display:grid;gap:8px;align-content:start}
.et-t{font-weight:700;font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--radius-sm);padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.sm{padding:5px 10px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.perigo{color:var(--bad)}
.tg{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 9px}
.tg.ok{background:var(--ok-bg);color:var(--ok)}.tg.warn{background:var(--warn-bg);color:var(--warn)}.tg.bad{background:var(--bad-bg);color:var(--bad)}.tg.info{background:var(--info-bg);color:var(--info)}.tg.mute{background:var(--mute-bg);color:var(--ink-soft)}
.aviso{border-radius:var(--radius-sm);padding:10px 13px;font-size:13px;margin:0 0 12px;line-height:1.45}.aviso.bad{background:var(--bad-bg);color:var(--bad)}.aviso.warn{background:var(--warn-bg);color:var(--warn)}
.dica{font-size:12px;color:var(--ink-soft);line-height:1.4}.ruim{color:var(--bad);font-weight:700}
.vazio{text-align:center;color:var(--ink-soft);padding:28px}
select,input[type=text],textarea{width:100%;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-family:inherit;font-size:14px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.mf{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10040;display:flex;align-items:flex-start;justify-content:center;padding:14px;overflow:auto}
.md{background:var(--panel);border-radius:16px;max-width:860px;width:100%;padding:18px 20px;margin:auto}
.md-cab{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.etapas-ok{margin:6px 0 10px;padding:8px 10px;background:var(--mute-bg);border-radius:8px}
.secao{margin:16px 2px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-mute);font-weight:800}
.item{border:1.5px solid var(--line);border-radius:var(--radius-md);padding:11px 13px;margin-bottom:8px;display:grid;gap:7px}
.item.nc{border-color:var(--bad);background:color-mix(in srgb,var(--bad-bg) 40%,var(--panel))}
.item .tx{font-weight:650;line-height:1.35}
.resp{display:flex;gap:8px}
.resp button{flex:1;min-height:44px;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit}
.resp button.on.S{background:var(--ok);border-color:var(--ok);color:#fff}.resp button.on.N{background:var(--bad);border-color:var(--bad);color:#fff}.resp button.on.NA{background:var(--ink-soft);border-color:var(--ink-soft);color:#fff}
.resp button:disabled{cursor:default;opacity:.85}
.lin{display:flex;gap:8px;align-items:center}.lin input{max-width:140px}
.amostras{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.amostras input{padding:7px 6px;text-align:center;font-variant-numeric:tabular-nums}
.amostras input.fora{border-color:var(--bad);background:var(--bad-bg)}
.estat{font-size:13px}
input.nom{display:inline-block;width:90px;padding:4px 6px}
.fotos{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.fotos img{height:54px;border-radius:6px;object-fit:cover}
.obs{font-size:13px}
.rodape{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap;position:sticky;bottom:-18px;background:var(--panel);padding:10px 0}
.toast{position:fixed;top:18px;right:18px;z-index:10050;background:var(--ok);color:#fff;padding:12px 16px;border-radius:10px;font-size:13.5px;max-width:380px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.erro{background:var(--bad)}
@media (max-width:760px){.pg{padding:14px 10px 80px}h1{font-size:22px}.etapas{grid-template-columns:1fr}.amostras{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body class="kuryos-theme has-sidebar">
<main class="pg">
  <div class="head">
    <div>
      <h1>Liberação de linha</h1>
      <div class="sub">Antes de produzir cada lote: <b>1.</b> assepsia da linha (o operador limpa e registra; a Qualidade verifica) e <b>2.</b> setup e first article (a Qualidade confere a linha, os insumos, a codificação e o peso das primeiras unidades; o líder da linha assina).</div>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="trava" class="tg mute">…</span><span id="conn" class="tg mute">Conectando…</span></div>
  </div>
  <div id="avisoModelo"></div>
  <div class="barra"><select id="fLinha" aria-label="Linha de envase"></select></div>
  <div id="lista"><div class="card">Carregando…</div></div>
</main>
<div id="modais"></div>

</html>
