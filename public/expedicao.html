<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expedição de Vendas</title><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script><script src="shared/utils.js"></script><script src="auth_check.js"></script><link rel="stylesheet" href="shared/theme.css"><style>body{margin:0;background:#f5f6fa;font-family:var(--font-ui);color:#182230}.wrap{max-width:1200px;margin:auto;padding:26px 18px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px}.head h1{margin:0}.sub{font-size:13px;color:#667085;margin-top:4px}.card{background:#fff;border-radius:15px;padding:18px;margin-top:16px;box-shadow:0 4px 18px #172b4d0d;border:1px solid #eaecf0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{padding:12px;border:1px solid #e2e6ee;border-radius:10px;margin:8px 0}.badge{font-size:10px;font-weight:800;background:#e7efff;color:#17479e;border-radius:20px;padding:3px 7px}.btn{border:0;border-radius:8px;padding:9px 12px;background:#0a1c69;color:#fff;font-weight:700;cursor:pointer}.ghost{background:#fff;color:#344054;border:1px solid #d0d5dd}label{font-size:11px;font-weight:800;color:#667085;display:block;margin:7px 0 3px}input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d0d5dd;border-radius:7px;font:inherit;font-size:13px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #eaecf0;text-align:left}.notice{padding:10px;background:#eef5ff;border-left:3px solid #2e6ac6;font-size:12px;border-radius:5px;margin:10px 0}.hide{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body class="kuryos-theme has-sidebar"><main class="wrap"><div class="head"><div><h1>Expedição de Vendas</h1><div class="sub">Faturamento, carga, coleta ou entrega de produto acabado</div></div></div><div class="notice">Só registre carga contra produto já produzido. A baixa física do lote continua no WMS até a migração do mecanismo de saída; esta tela controla o compromisso comercial, NF e saldo entregue.</div><div class="grid"><section class="card"><h2>Nova carga</h2><label>Pedido comercial *</label><select id="pedido"><option value="">Carregando...</option></select><div id="itens"></div><label>Tipo *</label><select id="tipo"><option value="ENTREGA">Entrega CIF — Kuryos entrega/contrata</option><option value="COLETA">Coleta FOB — cliente coleta/contrata</option></select><label>Data da carga *</label><input id="data" type="date"><label>NF emitida externamente</label><div class="grid"><input id="nf" placeholder="Número"><input id="serie" placeholder="Série"></div><label>Chave NF-e / referência</label><input id="chave" placeholder="Opcional"><label>Valor faturado R$</label><input id="valor" type="number" min="0" step=".01"><label>Transportadora / prestador</label><input id="transportadora" placeholder="Cliente, Uber, Lalamove..."><label>Motorista / placa</label><input id="veiculo" placeholder="Opcional"><label>Observações</label><textarea id="obs" rows="2"></textarea><p><button class="btn" id="salvar">Registrar carga</button></p></section><section class="card"><h2>Cargas recentes</h2><div id="lista"></div></section></div></main><script>var firebaseConfig={apiKey:'AIzaSyAKfI4MTbydlskdg5lMuvESfLIBhlPwQdw',authDomain:'prod-kuryos.firebaseapp.com',databaseURL:kuryosDatabaseURL('https://prod-kuryos-default-rtdb.firebaseio.com'),projectId:'prod-kuryos',storageBucket:'prod-kuryos.firebasestorage.app',messagingSenderId:'323674581733',appId:'1:323674581733:web:e283a491c0c2bd6025420c'};firebase.initializeApp(firebaseConfig);kuryosConnectEmulatorsIfLocal();var db=firebase.database(),pcs={},dem={},cargas={};function e(x){return escapeHtml(String(x||''))}function me(){return(window.currentUser&&window.currentUser.nome)||'Usuário'}function evt(id,t){var k=db.ref('comercial_eventos/'+id).push().key;return db.ref('comercial_eventos/'+id+'/'+k).set({tipo:t,em:new Date().toISOString(),por:me()})}function render(){var sel=document.getElementById('pedido'),old=sel.value;sel.innerHTML='<option value="">Selecione...</option>'+Object.entries(pcs).filter(function(x){return x[1].status!=='CANCELADO'}).map(function(x){return'<option value="'+e(x[0])+'">'+e((x[1].numeroFormatado||x[0])+' — '+x[1].cliente)+'</option>'}).join('');sel.value=old;var arr=Object.entries(cargas).sort(function(a,b){return String(b[1].criadoEm||'').localeCompare(String(a[1].criadoEm||''))});document.getElementById('lista').innerHTML='<table><tr><th>Carga</th><th>Pedido</th><th>NF</th><th>Data</th><th>Status</th></tr>'+arr.map(function(x){var c=x[1];return'<tr><td><b>'+e(c.numero||x[0].slice(-6))+'</b></td><td>'+e(c.pedidoId)+'</td><td>'+e(c.nf||'—')+'</td><td>'+e(c.data)+'</td><td><span class="badge">'+e(c.status)+'</span></td></tr>'}).join('')+'</table>'+(arr.length?'':'<p class="sub">Nenhuma carga registrada.</p>')}function itens(){var id=document.getElementById('pedido').value,p=pcs[id];document.getElementById('itens').innerHTML=!p?'':(p.itens||[]).map(function(i){var d=dem[id+'__'+sanitizeKey(i.sku)]||{},saldo=Math.max(0,(d.produzido||0)-Number(i.expedido||0));return'<div class="item"><b>'+e(i.sku)+' — '+e(i.descricao)+'</b><div class="sub">Produzido: '+(d.produzido||0)+' · saldo disponível p/ carga: '+saldo+'</div><label>Quantidade nesta carga</label><input class="q" data-sku="'+e(i.sku)+'" data-max="'+saldo+'" type="number" min="0" max="'+saldo+'" value="0"></div>'}).join('')}document.getElementById('pedido').onchange=itens;document.getElementById('salvar').onclick=function(){var id=document.getElementById('pedido').value;if(!id)return alert('Selecione o pedido.');var linhas=[].map.call(document.querySelectorAll('.q'),function(x){return{sku:x.dataset.sku,qtd:Number(x.value)||0,max:Number(x.dataset.max)||0}}).filter(function(x){return x.qtd>0});if(!linhas.length||linhas.some(function(x){return x.qtd>x.max}))return alert('Informe quantidades válidas, dentro do produzido ainda não expedido.');var key=db.ref('expedicoes_comerciais').push().key,now=new Date().toISOString(),u={};u['expedicoes_comerciais/'+key]={numero:'EXP-'+key.slice(-6).toUpperCase(),pedidoId:id,cliente:pcs[id].cliente,data:document.getElementById('data').value,status:'FATURADO_AGUARDANDO_'+(document.getElementById('tipo').value==='COLETA'?'COLETA':'ENTREGA'),tipo:document.getElementById('tipo').value,nf:document.getElementById('nf').value.trim(),serie:document.getElementById('serie').value.trim(),chaveNfe:document.getElementById('chave').value.trim(),valorFaturado:Number(document.getElementById('valor').value)||0,transportadora:document.getElementById('transportadora').value.trim(),veiculo:document.getElementById('veiculo').value.trim(),observacoes:document.getElementById('obs').value.trim(),itens:linhas,criadoEm:now,criadoPor:me()};linhas.forEach(function(l){var ix=(pcs[id].itens||[]).findIndex(function(i){return i.sku===l.sku});u['pedidos_comerciais/'+id+'/itens/'+ix+'/expedido']=(Number(pcs[id].itens[ix].expedido)||0)+l.qtd});db.ref().update(u).then(function(){return evt(id,'CARGA_REGISTRADA')}).then(function(){alert('Carga registrada. Registre a baixa física do lote no WMS até a integração de saída ser ativada.');itens()}).catch(function(x){alert('Erro: '+x.message)})};document.getElementById('data').value=new Date().toISOString().slice(0,10);dbOnValue(db.ref('pedidos_comerciais'),function(s){pcs=s.val()||{};render()});dbOnValue(db.ref('pedidos'),function(s){dem=s.val()||{};itens()});dbOnValue(db.ref('expedicoes_comerciais'),function(s){cargas=s.val()||{};render()});</script></body></html>
