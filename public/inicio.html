<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Início</title>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://prod-kuryos-default-rtdb.firebaseio.com">
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
  <script src="shared/utils.js"></script>
  <script src="shared/navegacao.js"></script>
  <script src="shared/manipulacao.js"></script>
  <script src="shared/pesagens-dia.js"></script>
  <script src="shared/inspecao-total-pa.js"></script>
  <script src="shared/cargas-pa.js"></script>
  <script src="auth_check.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="shared/theme.css">
  <style>
    :root{--primary:#0a1c69;--danger:#d03b3b;--warning:#c9910a;--bg:#f5f5f7;--card:#fff;--border:#d2d2d7;--text:#1d1d1f;--muted:#6e6e73;--tint-red-bg:#fee2e2;--tint-red-fg:#991b1b;--tint-gray-bg:#f3f4f6;--tint-blue-bg:#eff6ff;--tint-orange-bg:#fff7ed;--tint-orange-fg:#c2410c}
    @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--primary:#5e83ea;--bg:#000;--card:#1c1c1e;--border:#38383a;--text:#f5f5f7;--muted:#98989d;--tint-red-bg:rgba(239,68,68,.18);--tint-red-fg:#fca5a5;--tint-gray-bg:#2c2c2e;--tint-blue-bg:rgba(94,131,234,.16);--tint-orange-bg:rgba(249,115,22,.18);--tint-orange-fg:#fdba74}}
    :root[data-theme="dark"]{color-scheme:dark;--primary:#5e83ea;--bg:#000;--card:#1c1c1e;--border:#38383a;--text:#f5f5f7;--muted:#98989d;--tint-red-bg:rgba(239,68,68,.18);--tint-red-fg:#fca5a5;--tint-gray-bg:#2c2c2e;--tint-blue-bg:rgba(94,131,234,.16);--tint-orange-bg:rgba(249,115,22,.18);--tint-orange-fg:#fdba74}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--font-ui);background:var(--bg);color:var(--text);min-height:100vh}
    .header{padding:26px 0 6px;max-width:96%;margin:0 auto}
    .header h1{font-size:28px;font-weight:700;letter-spacing:-.02em}
    .header-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
    .main{padding:0 0 40px;max-width:96%;margin:0 auto}
    h2{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:22px 0 10px}
    .pend{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
    .cartao{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--warning);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--text);min-height:76px}
    .cartao:hover{background:var(--tint-blue-bg)}
    .cartao.alerta{border-left-color:var(--danger)}
    .cartao .n{font-size:30px;font-weight:700;letter-spacing:-.02em;min-width:42px;text-align:center}
    .cartao.alerta .n{color:var(--danger)}
    .cartao b{display:block;font-size:14px}
    .cartao small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
    .vazio{background:var(--card);border:1px dashed var(--border);border-radius:14px;padding:16px;color:var(--muted);font-size:13.5px}
    .areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
    .area{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
    .area h3{font-size:13px;font-weight:700;margin-bottom:6px}
    .area .sub{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:8px 0 2px}
    .area a{display:block;padding:7px 4px;font-size:13.5px;color:var(--text);text-decoration:none;border-radius:8px}
    .area a:hover{background:var(--tint-blue-bg);color:var(--primary)}
    @media (max-width:700px){.area a{padding:14px 6px}}
  </style>
</head>
<body class="kuryos-theme has-sidebar">
<div class="header">
  <h1 id="ola">Início</h1>
  <div class="header-sub" id="sub"></div>
</div>
<div class="main">
  <section id="secPend" style="display:none">
    <h2>Precisa de você</h2>
    <div class="pend" id="pend"></div>
  </section>
  <section>
    <h2>Suas áreas</h2>
    <div class="areas" id="areas"></div>
  </section>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyAKfI4MTbydlskdg5lMuvESfLIBhlPwQdw",
  authDomain: "prod-kuryos.firebaseapp.com",
  databaseURL: kuryosDatabaseURL("https://prod-kuryos-default-rtdb.firebaseio.com"),
  projectId: "prod-kuryos",
  storageBucket: "prod-kuryos.firebasestorage.app",
  messagingSenderId: "323674581733",
  appId: "1:323674581733:web:e283a491c0c2bd6025420c"
};
firebase.initializeApp(firebaseConfig);
kuryosConnectEmulatorsIfLocal();
var db = firebase.database();

function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; }); }

var dados = {}, carregadas = {}, cartoes = [], ctx = null;

function montarContexto() {
  var u = window.currentUser;
  return {
    podeAbrir: function(pg) { return podeAbrirPagina(u, pg); },
    temMod: function(m) { return usuarioTemModulo(u, m); },
    setores: setoresOperacao(u)
  };
}

function saudacao() {
  var u = window.currentUser, h = new Date().getHours();
  var periodo = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
  $('ola').textContent = periodo + ', ' + String(u.nome || '').split(' ')[0];
  var dia = new Date().toLocaleDateString('pt-BR', {weekday: 'long', day: '2-digit', month: 'long'});
  $('sub').textContent = dia.charAt(0).toUpperCase() + dia.slice(1);
}

function desenharAreas() {
  var blocos = KuryosNav.blocos(ctx);
  $('areas').innerHTML = blocos.map(function(b) {
    var sub = null;
    var links = b.itens.map(function(it) {
      var cab = '';
      if (it.s !== sub) { sub = it.s; if (it.s) cab = '<div class="sub">' + esc(it.s) + '</div>'; }
      return cab + '<a href="' + esc(it.h) + '">' + esc(it.r) + '</a>';
    }).join('');
    return '<div class="area"><h3>' + esc(b.nome) + '</h3>' + links + '</div>';
  }).join('') || '<div class="vazio">Seu usuário ainda não tem nenhuma área liberada. Peça a um administrador em Usuários.</div>';
}

function desenharPendencias() {
  if (!cartoes.length) { $('secPend').style.display = 'none'; return; }
  $('secPend').style.display = '';
  var prontos = cartoes.every(function(c) { return c.fontes.every(function(f) { return carregadas[f]; }); });
  var lista = KuryosNav.pendencias(cartoes, dados, {
    InspecaoTotalPA: window.InspecaoTotalPA, PesagensDia: window.PesagensDia, CargasPA: window.CargasPA,
    hoje: window.PesagensDia ? PesagensDia.diaLocal(new Date().toISOString()) : '', agora: Date.now()
  });
  if (!lista.length) {
    $('pend').innerHTML = '<div class="vazio">' + (prontos ? 'Nada esperando por você agora nas suas áreas.' : 'Carregando…') + '</div>';
    return;
  }
  $('pend').innerHTML = lista.map(function(p) {
    return '<a class="cartao ' + (p.tom === 'alerta' ? 'alerta' : '') + '" href="' + esc(p.href) + '"><span class="n">' + p.n + '</span>' +
      '<span><b>' + esc(p.titulo) + '</b><small>' + esc(p.texto || '') + '</small></span></a>';
  }).join('');
}

function iniciar() {
  ctx = montarContexto();
  saudacao();
  desenharAreas();
  cartoes = KuryosNav.cartoesVisiveis(ctx);
  desenharPendencias();
  // Só lê os nós que os cartões desta pessoa precisam.
  KuryosNav.fontesNecessarias(cartoes).forEach(function(f) {
    dbOnValue(db.ref(f), function(s) { dados[f] = s.val() || {}; carregadas[f] = true; desenharPendencias(); },
      {onError: function() { carregadas[f] = true; desenharPendencias(); }});
  });
}
(function esperarLogin() { if (!window.currentUser) { setTimeout(esperarLogin, 150); return; } iniciar(); })();
</script>
</body>
</html>
